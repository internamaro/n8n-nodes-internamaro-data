# Publish n8n-nodes-internamaro-data to npm with a provenance statement.
#
# One-time setup (owner):
#   npmjs.com > Access Tokens > Generate New Token > Granular Access Token,
#   "Read and write" for packages (scope it to n8n-nodes-internamaro-data after the first publish),
#   then GitHub repo > Settings > Secrets and variables > Actions > New repository secret:
#   NPM_TOKEN = <that token>.
#   (Alternative without a token: npm Trusted Publishing for this repo + workflow publish.yml.)
#
# Release: bump "version" in package.json, commit, then push a tag with the same version,
#   e.g. git tag 0.1.0 && git push origin 0.1.0

name: Publish

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Required to mint the OIDC token that signs the npm provenance statement.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json version $v"; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Publish with provenance
        # RELEASE_MODE lets the starter's prepublishOnly guard (n8n-node prerelease) pass in CI.
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
